<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAME - 火焰公链 | 下一代Web3生态</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFB800;
            --accent: #FF9F43;
            --success: #00D26A;
            --warning: #FFB800;
            --danger: #FF4D4F;
            
            --bg-dark: #050508;
            --bg-darker: #030305;
            --bg-card: rgba(12, 12, 18, 0.7);
            --bg-card-hover: rgba(18, 18, 28, 0.9);
            
            --text-primary: #FFFFFF;
            --text-secondary: #B8B8C8;
            --text-muted: #6B6B7B;
            
            --border: rgba(255, 107, 53, 0.15);
            --border-light: rgba(255, 184, 0, 0.2);
            --border-glow: rgba(255, 107, 53, 0.4);
            
            --glow-primary: rgba(255, 107, 53, 0.3);
            --glow-secondary: rgba(255, 184, 0, 0.25);
            
            --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            --gradient-bg: linear-gradient(180deg, #050508 0%, #080812 50%, #050508 100%);
            
            --section-spacing: 120px;
            --section-spacing-mini: 80px;
            --card-padding: 40px;
            --card-radius: 24px;
            
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-base: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 20px;
            --font-size-2xl: 24px;
            --font-size-3xl: 32px;
            --font-size-4xl: 42px;
            --font-size-5xl: 56px;
            --font-size-6xl: 72px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--gradient-bg);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 16px;
        }

        .app {
            min-height: 100vh;
            position: relative;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 107, 53, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 107, 53, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(255, 107, 53, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: bgRotate 60s linear infinite;
        }

        @keyframes bgRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 32px;
            position: relative;
            z-index: 1;
        }

        .header {
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            font-size: 36px;
            position: relative;
        }

        .flame-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: flamePulse 2s ease-in-out infinite;
        }

        @keyframes flamePulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo-main {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-sub {
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .nav {
            display: flex;
            gap: 40px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            position: relative;
            padding: 6px 0;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gradient-primary);
            transition: width 0.3s ease;
        }

        .nav-link:hover {
            color: var(--text-primary);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .network-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            background: rgba(255, 107, 53, 0.08);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }

        .network-dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
        }

        .network-dot.pulse {
            animation: networkPulse 2s ease-in-out infinite;
        }

        @keyframes networkPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 210, 106, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(0, 210, 106, 0);
            }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 6px 24px rgba(255, 107, 53, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.45);
        }

        .btn-large {
            padding: 18px 40px;
            font-size: 16px;
        }

        .btn-mine {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-mine:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.45);
        }

        .btn-mine:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: rgba(255, 107, 53, 0.08);
            border-color: var(--border-glow);
        }

        .btn-glow {
            position: relative;
            overflow: hidden;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn-glow:hover::before {
            left: 100%;
        }

        .btn-icon {
            font-size: 20px;
        }

        .hero {
            padding: 140px 0 120px;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 14px 28px;
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid var(--border);
            border-radius: 50px;
            margin-bottom: 42px;
            animation: badgeFloat 3s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.1);
        }

        @keyframes badgeFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .badge-lines {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .badge-lines .line {
            width: 28px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .badge-dot {
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
        }

        .badge-dot.pulse {
            animation: badgePulse 1.5s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 210, 106, 0.7);
            }
            50% {
                box-shadow: 0 0 0 16px rgba(0, 210, 106, 0);
            }
        }

        .badge-text {
            font-size: var(--font-size-sm);
            font-weight: 700;
            color: var(--text-secondary);
            font-family: 'Orbitron', monospace;
            letter-spacing: 2px;
        }

        .hero-title {
            font-size: var(--font-size-6xl);
            font-weight: 800;
            line-height: 1.05;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .title-line {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .cyber-text {
            font-family: 'Orbitron', monospace;
            color: var(--text-primary);
        }

        .glow-text {
            font-family: 'Orbitron', monospace;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(255, 107, 53, 0.8), 0 0 120px rgba(255, 107, 53, 0.4);
            position: relative;
            animation: textGlow 3s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.2);
            }
        }

        .hero-description {
            font-size: var(--font-size-lg);
            color: var(--text-secondary);
            max-width: 780px;
            margin: 0 auto 48px;
            line-height: 1.9;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 80px;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: var(--card-padding);
            min-width: 220px;
            position: relative;
            overflow: hidden;
        }

        .cyber-border {
            position: relative;
        }

        .stat-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: var(--primary);
            border-style: solid;
            border-width: 0;
        }

        .stat-corner.top-left {
            top: -1px;
            left: -1px;
            border-top-width: 3px;
            border-left-width: 3px;
        }

        .stat-corner.top-right {
            top: -1px;
            right: -1px;
            border-top-width: 3px;
            border-right-width: 3px;
        }

        .stat-corner.bottom-left {
            bottom: -1px;
            left: -1px;
            border-bottom-width: 3px;
            border-left-width: 3px;
        }

        .stat-corner.bottom-right {
            bottom: -1px;
            right: -1px;
            border-bottom-width: 3px;
            border-right-width: 3px;
        }

        .stat-number {
            font-family: 'Orbitron', monospace;
            font-size: 36px;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .stat-trend {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .stat-trend.up {
            color: var(--success);
        }

        .stat-trend.stable {
            color: var(--text-muted);
        }

        .trend-icon {
            font-size: 16px;
        }

        .trend-value {
            font-weight: 700;
        }

        .trend-text {
            color: var(--text-muted);
        }

        .hero-decoration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .deco-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--border);
        }

        .deco-circle.circle-1 {
            width: 450px;
            height: 450px;
            top: -120px;
            right: -120px;
            opacity: 0.3;
            animation: circleFloat 15s ease-in-out infinite;
        }

        .deco-circle.circle-2 {
            width: 250px;
            height: 250px;
            bottom: 60px;
            left: -60px;
            opacity: 0.2;
            animation: circleFloat 20s ease-in-out infinite reverse;
        }

        @keyframes circleFloat {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(24px, -24px) rotate(120deg);
            }
            66% {
                transform: translate(-12px, 12px) rotate(240deg);
            }
        }

        .deco-line {
            position: absolute;
            width: 240px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .deco-line.line-1 {
            top: 30%;
            left: 10%;
            transform: rotate(-30deg);
            opacity: 0.3;
        }

        .deco-line.line-2 {
            bottom: 20%;
            right: 10%;
            transform: rotate(30deg);
            opacity: 0.3;
        }

        .section-header {
            text-align: center;
            margin-bottom: 72px;
        }

        .section-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid var(--border);
            border-radius: 30px;
            margin-bottom: 28px;
        }

        .badge-icon {
            font-size: 20px;
        }

        .section-badge span:last-child {
            font-size: var(--font-size-sm);
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title {
            font-size: var(--font-size-4xl);
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            line-height: 1.25;
        }

        .features {
            padding: var(--section-spacing) 0;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 32px;
        }

        .feature-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: var(--card-padding);
            position: relative;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gradient-primary);
            transform: scaleX(0);
            transition: transform 0.5s ease;
        }

        .feature-card:hover::before {
            transform: scaleX(1);
        }

        .feature-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: var(--bg-card-hover);
            border-color: var(--border-glow);
            box-shadow: 0 32px 64px rgba(255, 107, 53, 0.18), 0 0 40px rgba(255, 107, 53, 0.08);
        }

        .feature-icon {
            font-size: 44px;
            margin-bottom: 28px;
            position: relative;
            display: inline-block;
        }

        .feature-icon.glow .icon-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
        }

        .feature-title {
            font-size: var(--font-size-xl);
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .feature-desc {
            font-size: var(--font-size-base);
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .feature-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .meta-badge {
            padding: 8px 18px;
            background: rgba(255, 107, 53, 0.12);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: var(--font-size-sm);
            font-weight: 700;
            color: var(--secondary);
            transition: all 0.3s ease;
        }

        .meta-badge:hover {
            background: rgba(255, 107, 53, 0.2);
            border-color: var(--border-glow);
        }

        .mine {
            padding: var(--section-spacing-mini) 0;
        }

        .mine-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 52px;
            position: relative;
            overflow: hidden;
        }

        .mine-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 44px;
            flex-wrap: wrap;
            gap: 32px;
        }

        .mine-title-wrap {
            flex: 1;
        }

        .mine-title {
            font-size: var(--font-size-3xl);
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .title-icon {
            font-size: var(--font-size-3xl);
        }

        .mine-subtitle {
            font-size: var(--font-size-base);
            color: var(--text-secondary);
        }

        .countdown {
            text-align: right;
        }

        .countdown-label {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .countdown-timer {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', monospace;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-value {
            font-size: var(--font-size-3xl);
            font-weight: 800;
            color: var(--secondary);
            min-width: 52px;
            text-align: center;
        }

        .time-label {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .time-separator {
            font-size: var(--font-size-2xl);
            color: var(--text-muted);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 44px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            border-color: var(--border-glow);
            background: rgba(0, 0, 0, 0.4);
        }

        .stat-item-glow {
            position: relative;
            overflow: hidden;
        }

        .stat-item-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.15), transparent);
            transition: left 0.7s ease;
        }

        .stat-item-glow:hover::before {
            left: 100%;
        }

        .stat-item-icon {
            font-size: 32px;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 107, 53, 0.12);
            border-radius: 16px;
            position: relative;
        }

        .icon-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid var(--border);
            border-radius: 16px;
            animation: ringPulse 2s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.15);
                opacity: 0;
            }
        }

        .stat-item-content {
            flex: 1;
        }

        .stat-item-label {
            font-size: var(--font-size-sm);
